# UGNAY local development infrastructure.
#
#   docker compose up -d            -> Postgres + Adminer (DB UI)
#
# The API and Next.js frontend are run locally during development
# (`dotnet run` / `npm run dev`) so hot-reload works. Container images for
# the app tiers are a later concern; this file provides their dependencies.

services:
  postgres:
    image: postgres:17-alpine
    container_name: ugnay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ugnay}
      POSTGRES_USER: ${POSTGRES_USER:-ugnay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ugnay_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ugnay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ugnay} -d ${POSTGRES_DB:-ugnay}"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:5
    container_name: ugnay-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ugnay_pgdata:
